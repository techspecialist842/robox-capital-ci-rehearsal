[project]
name = "robox-quant-service"
version = "0.1.0"
description = "Servicio Python/FastAPI: datos de mercado, backtesting, motor de riesgo, orquestacion de IA (ADR-001)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
