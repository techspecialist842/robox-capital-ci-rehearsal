version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: robox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robox}
      POSTGRES_USER: ${POSTGRES_USER:-robox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robox_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - robox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: robox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  robox_postgres_data:
