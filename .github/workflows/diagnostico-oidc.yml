name: Diagnostico OIDC

# Temporal. Imprime las afirmaciones del token que GitHub emite, para poder
# ajustar la politica de confianza contra el valor real en lugar de deducirlo.
# Solo muestra "sub" y "aud"; nunca el token.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  con-entorno:
    name: Con environment declarado
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Mostrar afirmaciones
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          CUERPO=$(echo "$TOKEN" | cut -d. -f2)
          CUERPO="${CUERPO}$(printf '%*s' $(( (4 - ${#CUERPO} % 4) % 4 )) '' | tr ' ' '=')"
          echo "$CUERPO" | base64 -d 2>/dev/null | jq '{sub, aud, repository, environment, ref}'

  sin-entorno:
    name: Sin environment
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar afirmaciones
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          CUERPO=$(echo "$TOKEN" | cut -d. -f2)
          CUERPO="${CUERPO}$(printf '%*s' $(( (4 - ${#CUERPO} % 4) % 4 )) '' | tr ' ' '=')"
          echo "$CUERPO" | base64 -d 2>/dev/null | jq '{sub, aud, repository, environment, ref}'
