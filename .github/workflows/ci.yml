name: CI

# Pipeline base de la Fase 1 (Kickoff §2, Dia 5-6): lint + pruebas unitarias/integracion + build
# para cada app, mas una etapa de prueba de contrato de eventos que valida que los payloads de
# ejemplo de api-gateway y quant-service cumplen los esquemas versionados de packages/event-contracts.
# El deploy real (a las cuentas AWS del cliente) se agrega una vez resuelto el Open Item 5.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-gateway:
    name: API Gateway (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api-gateway/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Prueba de contrato de API: falla si el codigo produce un contrato distinto
      # al openapi.json versionado, para que ningun cambio de la API se cuele sin
      # quedar visible en la revision.
      - run: npm run openapi:check

  quant-service:
    name: Quant Service (Python/FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quant-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-dev.txt trae ruff y pytest; sin el, los pasos de lint y
      # pruebas fallan con "command not found".
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  event-contract-tests:
    name: Pruebas de contrato de eventos (ADR-002)
    runs-on: ubuntu-latest
    needs: [api-gateway, quant-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar esquemas de eventos
        working-directory: packages/event-contracts
        run: npm install && npm run validate

  api-gateway-e2e:
    name: API Gateway — pruebas de integracion
    runs-on: ubuntu-latest
    # Verifica lo que las pruebas unitarias no pueden: que las guardas esten
    # conectadas a las rutas, que el token firmado se valide de vuelta y que la
    # revocacion via Redis surta efecto. Requiere Postgres y Redis de verdad.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: robox
          POSTGRES_USER: robox
          POSTGRES_PASSWORD: robox_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api-gateway
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: robox
      POSTGRES_USER: robox
      POSTGRES_PASSWORD: robox_dev_only
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: solo-para-ci-no-usar-en-ningun-entorno
      ENVIRONMENT: test
      EVENT_BUS_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api-gateway/package-lock.json
      - run: npm install
      - run: npm run migration:run
      - run: npm run test:e2e

  infra-synth:
    name: Infraestructura (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      # "agnostic" genera las plantillas sin cuenta ni region, que es lo unico
      # posible sin credenciales. Valida que el codigo de infraestructura compila
      # y sintetiza; no sustituye a un despliegue real.
      - run: npx cdk synth --quiet -c account=agnostic

  event-bus-integration:
    name: Bus de eventos de extremo a extremo (SNS/SQS)
    runs-on: ubuntu-latest
    # El runner es Linux con Docker, que es lo que permite ejercitar el transporte
    # real sin cuentas AWS. LocalStack emula SNS y SQS; no sustituye a una prueba
    # contra AWS de verdad, pero convierte el adaptador en codigo ejecutado.
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: sns,sqs
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crear topico, cola y suscripcion
        id: aws-setup
        run: |
          set -euo pipefail
          TOPIC_ARN=$(aws --endpoint-url=$AWS_ENDPOINT_URL sns create-topic \
            --name robox-ci-domain-events --query TopicArn --output text)
          QUEUE_URL=$(aws --endpoint-url=$AWS_ENDPOINT_URL sqs create-queue \
            --queue-name robox-ci-quant-service --query QueueUrl --output text)
          QUEUE_ARN=$(aws --endpoint-url=$AWS_ENDPOINT_URL sqs get-queue-attributes \
            --queue-url "$QUEUE_URL" --attribute-names QueueArn \
            --query 'Attributes.QueueArn' --output text)
          aws --endpoint-url=$AWS_ENDPOINT_URL sns subscribe \
            --topic-arn "$TOPIC_ARN" --protocol sqs --notification-endpoint "$QUEUE_ARN" \
            --attributes RawMessageDelivery=true
          echo "topic_arn=$TOPIC_ARN" >> "$GITHUB_OUTPUT"
          echo "queue_url=$QUEUE_URL" >> "$GITHUB_OUTPUT"

      - name: Compilar el api-gateway
        working-directory: apps/api-gateway
        run: npm install && npm run build

      # El identificador se genera aqui y se pasa al script. Capturarlo de stdout
      # no funciona: el logger de la aplicacion escribe en el mismo flujo.
      - name: Publicar el evento de prueba (NestJS -> SNS)
        id: publish
        working-directory: apps/api-gateway
        env:
          EVENT_BUS_TOPIC_ARN: ${{ steps.aws-setup.outputs.topic_arn }}
        run: |
          set -euo pipefail
          EVENT_ID=$(python -c "import uuid; print(uuid.uuid4())")
          echo "event_id=$EVENT_ID" >> "$GITHUB_OUTPUT"
          EVENT_ID="$EVENT_ID" node scripts/publish-test-event.js

      - name: Consumir y validar (SQS -> Python)
        working-directory: apps/quant-service
        env:
          EVENT_BUS_QUEUE_URL: ${{ steps.aws-setup.outputs.queue_url }}
        run: |
          pip install -r requirements.txt
          python scripts/consume_test_event.py "${{ steps.publish.outputs.event_id }}"

  security-scan:
    name: Escaneo de seguridad (Puerta 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dependencias de produccion: bloquean el pipeline. Son las que llegan al
      # artefacto desplegado, asi que un hallazgo alto aqui es un hallazgo real.
      - name: Dependencias de produccion (api-gateway)
        working-directory: apps/api-gateway
        run: npm audit --omit=dev --audit-level=high

      - name: Dependencias de produccion (event-contracts)
        working-directory: packages/event-contracts
        run: npm audit --omit=dev --audit-level=high

      # Cadena de herramientas de desarrollo: informativo. Un aviso en eslint o en
      # el CLI no llega a produccion y no debe frenar la entrega, pero queda visible.
      - name: Herramientas de desarrollo (informativo)
        working-directory: apps/api-gateway
        run: npm audit --audit-level=high || echo "::warning::hallazgos en dependencias de desarrollo — revisar, no bloquean"

      - name: Dependencias de Python
        working-directory: apps/quant-service
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt

      - name: SAST de Python (bandit)
        working-directory: apps/quant-service
        run: bandit -r app -ll

  flutter-app:
    name: Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
